
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>love and fun</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            color: #b4dff3;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
            width: 100%;
        }

        p {
            font-size: 20px;
            animation: pulse 2s infinite ease-in-out;
        }


        @media (max-width: 480px) {
            p {
                letter-spacing: 2px;
            }

            .loader {
                width: 35px;
                height: 35px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <p>준비중</p>
    </div>

</body>
</html>
